# Reverse proxy for the Kubernetes deployment (akvo-config k8s-manifests).
# Mirrors the Traefik routes used by the docker-compose prod stack:
#   /api, /admin, /static -> backend
#   /config.js            -> backend /api/v1/config.js
#   /media                -> uploaded files on the shared volume
#   everything else       -> Next.js frontend

large_client_header_buffers 16 32k;

gzip on;
gzip_comp_level    5;
gzip_min_length    256;
gzip_proxied       any;
gzip_vary          on;
gzip_types
application/javascript
application/json
application/geo+json
application/x-font-ttf
application/xml
font/opentype
image/bmp
image/svg+xml
image/x-icon
text/css
text/javascript
text/plain;

server {
    listen       80;
    server_name  _;
    server_tokens off;

    # The setup wizard uploads country boundary GeoJSON files
    client_max_body_size 50M;

    if ($http_x_forwarded_proto = "http") {
       return 301 https://$host$request_uri;
    }

    location /api {
        proxy_pass              http://backend:8000;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-Host $host;
        proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version      1.1;
        proxy_read_timeout      300s;
    }

    location = /config.js {
        proxy_pass              http://backend:8000/api/v1/config.js;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-Host $host;
        proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version      1.1;
    }

    location /admin {
        proxy_pass              http://backend:8000;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-Host $host;
        proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version      1.1;
    }

    location /static {
        proxy_pass              http://backend:8000;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
    }

    # Uploaded files (e.g. organization logos). Django only serves MEDIA_ROOT
    # when DEBUG=True, so nginx serves them from the shared volume instead.
    location /media/ {
        alias /app/media/;
        expires                 7d;
        add_header              Cache-Control "max-age=604800, public";
        try_files $uri =404;
    }

    location / {
        proxy_pass              http://frontend:3000;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-Host $host;
        proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection "upgrade";
    }
}
