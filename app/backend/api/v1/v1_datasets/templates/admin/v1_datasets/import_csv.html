{% extends "admin/base_site.html" %}
{% block content %}
<h1>Import client dataset (CSV)</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <p>
    <label>Dataset key (slug):
      <input type="text" name="dataset" placeholder="e.g. evi2" required>
    </label>
  </p>
  <p>
    <label>CSV file:
      <input type="file" name="csv_file" accept=".csv" required>
    </label>
  </p>
  <p>
    Columns: <code>administration_id, period (YYYY-MM), value</code>.
    A blank value is stored as missing (never 0).
    <a href="../csv-template/">Download template</a>.
  </p>
  <button type="submit" class="default">Import</button>
</form>
{% endblock %}
