name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feature/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short git commit SHA
        id: vars
        run: |
          shortSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$shortSha" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41

      - name: List all changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          for file in "$ALL_CHANGED_FILES"; do
            echo "$file was changed"
          done

      - name: Detect event type
        run: |
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
              echo "PULL_REQUEST_EVENT=true" >> $GITHUB_ENV
          else
              echo "PULL_REQUEST_EVENT=false" >> $GITHUB_ENV
          fi

      - name: Test
        env:
          CI_COMMIT: ${{ env.COMMIT_SHORT_SHA }}
          CI_BRANCH: ${{ github.ref_name }}
          CI_TAG: ""
          CI_PULL_REQUEST: ${{ env.PULL_REQUEST_EVENT }}
          COMPOSE_INTERACTIVE_NO_CLI: 1
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          DBDOCS_TOKEN: ${{ secrets.DBDOCS_TOKEN }}
          WEBDOMAIN: ${{ secrets.WEBDOMAIN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          ./ci/test.sh

      - name: Submit Coverage to Coveralls
        if: env.COVERALLS_REPO_TOKEN != ''
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: app/backend/coverage.xml
          fail-on-error: false

  cdi-pipeline:
    name: CDI pipeline (STEP_0100 -> 0301 -> 0303)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # numpy 2.0 and rasterio 1.3.10 ship cp312 wheels, so no build
          # toolchain or system GDAL is needed.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cdi/src/cdi-scripts/requirements.txt

      - name: Install dependencies
        working-directory: cdi/src/cdi-scripts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: cdi/src/cdi-scripts
        # The tests write into a tmp_path tree and chdir into it; they need no
        # repo data and touch nothing under the checkout.
        run: pytest __tests__/ -v

  cdi-geonode-upload:
    name: CDI GeoNode upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cdi/src/background-jobs/requirements.txt

      - name: Install dependencies
        working-directory: cdi/src/background-jobs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: cdi/src/background-jobs
        # Package-relative imports: invoke from here with upload_to_geonode as a
        # package. Every network call is mocked - no GeoNode credentials needed.
        run: pytest upload_to_geonode/__tests__/ -v
