name: Deploy to Test Cluster

# Builds the web app images (nginx, frontend, backend, worker), pushes them to
# eu.gcr.io/akvo-lumen/generic-dih/* and rolls out the deployments defined
# in akvo-config: k8s-manifests/test/generic-dih.
#
# GeoNode, Rundeck and the CDI pipeline are not part of this deployment; the
# backend reaches existing instances via GEONODE_* / RUNDECK_* (Vault secret).
#
# Required GitHub "Test" environment secrets:
#   GCLOUD_SERVICE_ACCOUNT_REGISTRY, GCLOUD_SERVICE_ACCOUNT_K8S
#   WEBDOMAIN, SESSION_SECRET, SETUP_SECRET_KEY, GEONODE_BASE_URL (frontend build)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-to-test
  cancel-in-progress: false

jobs:
  run-tests:
    name: Run Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build-push:
    name: Build and Push to Registry
    runs-on: ubuntu-latest
    needs: run-tests
    environment: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: src

      - name: Checkout Akvo composite actions
        uses: actions/checkout@v5
        with:
          repository: akvo/composite-actions
          path: composite-actions
          ref: 0.0.11

      - name: Prepare Frontend Build
        working-directory: src/app/frontend
        run: |
          mv next.config.prod.mjs next.config.mjs
          {
            echo 'WEBDOMAIN=${{ secrets.WEBDOMAIN }}'
            echo 'SESSION_SECRET=${{ secrets.SESSION_SECRET }}'
            echo 'SETUP_SECRET_KEY=${{ secrets.SETUP_SECRET_KEY }}'
            echo 'GEONODE_BASE_URL=${{ secrets.GEONODE_BASE_URL }}'
          } > .env
        shell: bash

      - name: Node Operations
        working-directory: src/app
        run: |
          docker run --rm \
            --volume "$(pwd)/frontend:/app" \
            --workdir "/app" \
            --entrypoint /bin/sh \
            akvo/akvo-node-18-alpine:20230831.105309.b9593b7 \
            -c "yarn install --no-progress --frozen-lockfile && yarn build"

      - name: Docker Build Nginx
        uses: ./composite-actions/.github/actions/docker-build
        with:
          app-name: "generic-dih"
          service-name: "nginx"
          dockerfile-location: "app/nginx"
          cluster-name: "test"

      - name: Docker Build Frontend
        uses: ./composite-actions/.github/actions/docker-build
        with:
          app-name: "generic-dih"
          service-name: "frontend"
          dockerfile-location: "app/frontend"
          cluster-name: "test"

      - name: Docker Build Backend
        uses: ./composite-actions/.github/actions/docker-build
        with:
          app-name: "generic-dih"
          service-name: "backend"
          dockerfile-location: "app/backend/Dockerfile.prod"
          cluster-name: "test"

      - name: Docker Build Worker
        uses: ./composite-actions/.github/actions/docker-build
        with:
          app-name: "generic-dih"
          service-name: "worker"
          dockerfile-location: "app/backend/Dockerfile.worker.prod"
          cluster-name: "test"

      - name: Docker Push Nginx
        uses: ./composite-actions/.github/actions/docker-push
        with:
          app-name: "generic-dih"
          service-name: "nginx"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_REGISTRY }}
          cluster-name: "test"

      - name: Docker Push Frontend
        uses: ./composite-actions/.github/actions/docker-push
        with:
          app-name: "generic-dih"
          service-name: "frontend"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_REGISTRY }}
          cluster-name: "test"

      - name: Docker Push Backend
        uses: ./composite-actions/.github/actions/docker-push
        with:
          app-name: "generic-dih"
          service-name: "backend"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_REGISTRY }}
          cluster-name: "test"

      - name: Docker Push Worker
        uses: ./composite-actions/.github/actions/docker-push
        with:
          app-name: "generic-dih"
          service-name: "worker"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_REGISTRY }}
          cluster-name: "test"

  rollout:
    name: Rollout to the server
    needs: build-push
    runs-on: ubuntu-latest
    environment: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: src

      - name: Checkout Akvo composite actions
        uses: actions/checkout@v5
        with:
          repository: akvo/composite-actions
          path: composite-actions
          ref: 0.0.11

      - name: Rollout Nginx
        uses: ./composite-actions/.github/actions/k8s-rollout
        with:
          app-name: "generic-dih"
          deployment-name: "nginx-deployment"
          container-name: "nginx"
          cluster-name: "test"
          namespace-name: "generic-dih-namespace"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_K8S }}

      - name: Rollout Frontend
        uses: ./composite-actions/.github/actions/k8s-rollout
        with:
          app-name: "generic-dih"
          deployment-name: "frontend-deployment"
          container-name: "frontend"
          cluster-name: "test"
          namespace-name: "generic-dih-namespace"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_K8S }}

      - name: Rollout Backend
        uses: ./composite-actions/.github/actions/k8s-rollout
        with:
          app-name: "generic-dih"
          deployment-name: "backend-deployment"
          container-name: "backend"
          cluster-name: "test"
          namespace-name: "generic-dih-namespace"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_K8S }}

      - name: Rollout Worker
        uses: ./composite-actions/.github/actions/k8s-rollout
        with:
          app-name: "generic-dih"
          deployment-name: "worker-deployment"
          container-name: "worker"
          cluster-name: "test"
          namespace-name: "generic-dih-namespace"
          gcloud-sa: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_K8S }}
