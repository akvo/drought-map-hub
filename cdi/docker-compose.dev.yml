services:
  cdi:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: cdi-scripts:latest
    container_name: cdi
    volumes:
      - ./src:/app/src
      - ./input_data:/app/input_data
      - ./output_data:/app/output_data
      - ./logs:/app/logs
      - ./config/cdi_project_settings.json:/app/src/cdi-scripts/cdi_project_settings.conf
      - ./.env:/app/.env
    working_dir: /app
    # Don't run the script immediately; let user exec into container
    command: ["sleep", "infinity"]
